name: Test test-diff-revision input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          api-key: fake-api-key-for-testing
          run-tests: "true"
          test-diff-revision: abc1234
        continue-on-error: true

      - name: Assert action ran with test-diff-revision input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # With a fake API key, run-tests=true, and test-diff-revision set,
          # the action should still run (installing the CLI and attempting
          # fossa test --diff <revision>).
          # We accept success or failure — both indicate the action ran.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with test-diff-revision input, outcome: $OUTCOME"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
