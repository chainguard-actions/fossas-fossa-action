name: Test working-directory input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a subdirectory to analyze
        run: |
          mkdir -p "$GITHUB_WORKSPACE/subproject"
          echo '{"name": "subproject", "version": "1.0.0"}' > "$GITHUB_WORKSPACE/subproject/package.json"

      - id: action
        uses: .
        with:
          api-key: fake-api-key-for-testing
          working-directory: subproject
        continue-on-error: true

      - name: Assert action ran with working-directory
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # With a fake API key, the action will fail at analysis, but it should
          # have attempted to analyze the 'subproject' directory.
          # We accept success or failure — both indicate the action ran.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with working-directory=subproject, outcome: $OUTCOME"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
